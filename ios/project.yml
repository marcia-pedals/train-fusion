# Source of truth for the Xcode project. Regenerate with `just ios` (xcodegen) after
# adding/removing files or changing settings; don't edit the .xcodeproj by hand.
name: TrainRecorder
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4Q3J7GB2S8
targets:
  TrainRecorder:
    type: application
    platform: iOS
    sources: [TrainRecorder]
    # Where the backend is, and the Identity Platform settings: Config.xcconfig (gitignored,
    # from `just ios-config`). Without it the app records and replays but can't upload or sign in.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    entitlements:
      path: TrainRecorder/TrainRecorder.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: TrainRecorder/Info.plist
      properties:
        CFBundleDisplayName: Train Fusion
        # trainfusion://auth/email-link?oobCode=…: the backend's /auth/email-link page hands
        # an emailed sign-in link to the app with this (Account.handle(url:))
        CFBundleURLTypes:
          - CFBundleURLName: io.github.marcia-pedals.TrainFusion
            CFBundleURLSchemes: [trainfusion]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Recording keeps the app running when backgrounded or locked.
        # Uploads finish in a background URL session, which needs no background mode.
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Records audio to sense the train. Recordings stay on your phone unless you choose to share one.
        NSMotionUsageDescription: Records motion and barometer to sense the train. Recordings stay on your phone unless you choose to share one.
        # from Config.xcconfig (Backend.swift)
        TRBackendHost: $(API_HOST)
        TRIdentityAPIKey: $(IDENTITY_API_KEY)
        TRGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        TRSiteHost: $(SITE_HOST)
        # Recordings show up in the Files app and in Finder, as a fallback to uploading.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Only standard HTTPS is used, which is exempt from export compliance.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.marcia-pedals.TrainFusion
        # Assets.xcassets/AppIcon: rendered from ios/AppIcon.svg (1024x1024, no transparency)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only (XcodeGen's iOS preset sets "1,2" per target).
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  TrainRecorder:
    build:
      targets:
        TrainRecorder: all
    # Run builds Release: the inference is tight loops over arrays, some 30× slower
    # unoptimised (replay crawls). Switch to Debug in Xcode when you need the debugger.
    run:
      config: Release
